name: Huawei-AgentArts-action
description: Run pinned DeepSeek Harness read-only tasks on AgentArts; publish only after Controller checks.
author: Lixiaoyiao
inputs:
  github-token:
    description: Controller-only GitHub token (contents read, pull-requests write).
    required: true
    default: ${{ github.token }}
  runtime-origin:
    description: HTTPS invocation origin from AgentArts Runtime details (no path).
    required: true
  runtime-name:
    description: Deployed high-code Runtime name.
    required: true
  runtime-endpoint:
    description: Explicit version alias pinned by the operator; Latest is rejected.
    required: true
  runtime-api-key:
    description: API_KEY for Runtime inbound authentication; never enters DSH or task body.
    required: true
  prompt:
    description: Optional trusted workflow instructions.
    default: ""
  context-files:
    description: JSON list of immutable repository text files to include.
    default: "[]"
  max-findings:
    description: Maximum independently filtered findings to publish.
    default: "20"
  timeout-minutes:
    description: Overall Controller deadline (1 to 10 minutes).
    default: "10"
  bot-user-id:
    description: Expected bot author ID for publication ownership checks.
    default: "41898282"
  command:
    description: auto, review, task or diagnose. Controlled fix and implement migration remains pending.
    default: auto
  allowed-tools:
    description: JSON grant list. workspace.read/search or Controller github.checks.read (task/diagnose only).
    default: '["workspace.read","workspace.search"]'
  max-turns:
    description: Bounded original Controller loop turns, including tool-result turns.
    default: "3"
  task-output-schema:
    description: Trusted JSON output schema for command task, validated by the original Controller.
    default: ""
  base-branch:
    description: Optional trusted branch for non-PR tasks; Controller resolves its immutable commit.
    default: ""
outputs:
  run-record:
    description: Absolute path of redacted task record for Demo and evidence.
  status:
    description: Upstream Controller outcome status.
  result-json:
    description: Structured upstream outcome.
runs:
  using: node24
  main: ../dist-agentarts/controller/index.js
