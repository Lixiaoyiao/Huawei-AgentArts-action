name: Actions token rate-limit diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    name: Inspect Actions token quota once
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read rate-limit status without running candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/dsh-actions-rate-limit.txt"
          gh api --include rate_limit > "$response_file"
          node --input-type=module - "$response_file" <<'NODE'
          import { readFileSync } from "node:fs";

          const response = readFileSync(process.argv[2], "utf8").replaceAll("\r\n", "\n");
          const boundary = response.indexOf("\n\n");
          if (boundary < 0) throw new Error("Missing HTTP response boundary");
          const lines = response.slice(0, boundary).split("\n");
          const status = /^HTTP\/\S+ (\d{3})\b/u.exec(lines[0] ?? "")?.[1];
          if (status !== "200") throw new Error("Expected successful rate-limit response");
          const headers = Object.fromEntries(lines.slice(1).flatMap((line) => {
            const separator = line.indexOf(":");
            const name = line.slice(0, separator).toLowerCase();
            return /^x-ratelimit-(limit|used|remaining|reset|resource)$/u.test(name)
              ? [[name, line.slice(separator + 1).trim()]] : [];
          }));
          const raw = JSON.parse(response.slice(boundary + 2)).resources.core;
          const core = Object.fromEntries(["limit", "used", "remaining", "reset"].map((name) => {
            const value = raw[name];
            if (!Number.isSafeInteger(value) || value < 0) throw new Error("Invalid core rate-limit counter");
            return [name, value];
          }));
          console.log(JSON.stringify({
            status: Number(status), headers, core,
            resetAt: new Date(core.reset * 1000).toISOString(),
          }, null, 2));
          NODE
