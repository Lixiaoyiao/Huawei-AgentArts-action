name: Actions content-read quota diagnostic

on:
  workflow_dispatch:
    inputs:
      blob_sha:
        description: Existing blob SHA in this repository (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect one repository blob response
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe content-read quota without running candidate code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BLOB_SHA: ${{ inputs.blob_sha }}
        run: |
          set -euo pipefail
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "blob_sha must be 40 lowercase hexadecimal characters" >&2
            exit 1
          }
          response_file="$RUNNER_TEMP/dsh-actions-rate-limit.txt"
          request_exit=0
          gh api --include --method GET "repos/$REPOSITORY/git/blobs/$BLOB_SHA" \
            > "$response_file" 2> "$RUNNER_TEMP/dsh-actions-rate-limit-error.txt" || request_exit=$?
          node --input-type=module - "$response_file" "$request_exit" <<'NODE'
          import { readFileSync } from "node:fs";

          const response = readFileSync(process.argv[2], "utf8").replaceAll("\r\n", "\n");
          const boundary = response.indexOf("\n\n");
          if (boundary < 0) throw new Error("Missing HTTP response boundary");
          const lines = response.slice(0, boundary).split("\n");
          const status = Number(/^HTTP\/\S+ (\d{3})\b/u.exec(lines[0] ?? "")?.[1]);
          if (![200, 403, 429].includes(status)) throw new Error("Unexpected blob response status");
          const headers = Object.fromEntries(lines.slice(1).flatMap((line) => {
            const separator = line.indexOf(":");
            const name = line.slice(0, separator).toLowerCase();
            return /^(x-ratelimit-(limit|used|remaining|reset|resource)|retry-after)$/u.test(name)
              ? [[name, line.slice(separator + 1).trim()]] : [];
          }));
          const quota = Object.fromEntries(["limit", "used", "remaining", "reset"].map((name) => {
            const raw = headers[`x-ratelimit-${name}`];
            const value = typeof raw === "string" && /^(0|[1-9]\d*)$/u.test(raw) ? Number(raw) : NaN;
            return [name, Number.isSafeInteger(value) ? value : "unknown"];
          }));
          const quotaKnown = Object.values(quota).every((value) => typeof value === "number");
          const reset = typeof quota.reset === "number" ? new Date(quota.reset * 1000) : undefined;
          const resetAt = reset !== undefined && Number.isFinite(reset.getTime())
            ? reset.toISOString() : "unknown";
          const requestSucceeded = status === 200 && process.argv[3] === "0";
          console.log(JSON.stringify({
            status, headers, quota, quotaKnown, resetAt, requestSucceeded,
          }, null, 2));
          if (!requestSucceeded || !quotaKnown || resetAt === "unknown") process.exitCode = 1;
          NODE
