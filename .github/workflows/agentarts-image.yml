name: AgentArts production image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/agentarts-image.yml
      - agentarts/Dockerfile
      - agentarts/smoke.mjs
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - src/**
      - assets/**
      - agentarts/full-smoke.mjs
      - agentarts/local-container.sh
      - agentarts/startup-negative.sh
      - agentarts/seccomp-*.json
      - agentarts/apparmor-*
      - agentarts/ci-apparmor.sh
      - agentarts/namespace-probe.mjs
      - test/fixtures/full-runtime-packets.mjs
      - test/fixtures/messages-sse.*
  pull_request:
    paths:
      - .github/workflows/agentarts-image.yml
      - agentarts/Dockerfile
      - agentarts/smoke.mjs
      - .dockerignore
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - src/**
      - assets/**
      - agentarts/full-smoke.mjs
      - agentarts/local-container.sh
      - agentarts/startup-negative.sh
      - agentarts/seccomp-*.json
      - agentarts/apparmor-*
      - agentarts/ci-apparmor.sh
      - agentarts/namespace-probe.mjs
      - test/fixtures/full-runtime-packets.mjs
      - test/fixtures/messages-sse.*

permissions:
  contents: read

concurrency:
  group: agentarts-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Runtime image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            node-arch: x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            node-arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify the exact candidate and absence of checkout credentials
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
      - name: Build and exercise the final Runtime image
        timeout-minutes: 15
        shell: bash
        env:
          AGENTARTS_TEST_PLATFORM: ${{ matrix.platform }}
          AGENTARTS_EVIDENCE_DIR: ${{ runner.temp }}/agentarts-container
          AGENTARTS_CI_APPARMOR_SETUP: "true"
          AGENTARTS_APPARMOR_PROFILE: agentarts-runtime-bwrap-v1
        run: bash agentarts/local-container.sh
      - name: Remove only the project namespace profile
        if: always()
        shell: bash
        env:
          AGENTARTS_EVIDENCE_DIR: ${{ runner.temp }}/agentarts-container
        run: bash agentarts/ci-apparmor.sh cleanup
      - name: Preserve measured container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentarts-image-smoke-${{ matrix.node-arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentarts-container
          if-no-files-found: warn
          retention-days: 14
